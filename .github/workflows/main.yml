name: Atualizar Vitrine UAU Achados

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar o robô de atualização
        run: python gerador_vitrine.py

      - name: Sincronizar com o repositório e enviar alterações
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Robô: Vitrine de achados atualizada automaticamente"
          branch: main
          push_options: '--force'
