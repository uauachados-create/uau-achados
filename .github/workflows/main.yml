name: Atualizar Vitrine UAU Achados

on:
  schedule:
    # O robô vai rodar automaticamente todo dia às 09:00 da manhã (Horário UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite que você clique em um botão para rodar manualmente quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar o robô de atualização
        run: python gerador_vitrine.py

      - name: Salvar e atualizar o site automaticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Robô: Vitrine de achados atualizada automaticamente"
          branch: main
